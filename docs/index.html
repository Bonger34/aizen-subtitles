<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱染诚 · 台词档案馆 | 罗布奥特曼</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
    <button type="button" class="site-header" id="refreshDiv" title="刷新档案室">
        <span class="header-band">
            <span class="header-brand">
                <span class="brand-name">AIZENTECH</span>
                <span class="brand-cn">爱染科技 · 档案科</span>
            </span>
            <span class="header-meta mono">怪兽水晶档案室 —— 全剧字幕对白检索</span>
        </span>
    </button>

    <main class="main-content">
        <section class="hero">
            <div class="hero-titleblock">
                <h1 class="hero-title">爱染诚 <span class="hero-sub">台词档案馆</span></h1>
                <p class="hero-stats mono" aria-live="polite">全 — 集 · 归档 — 条 · 爱染诚登场 — 条</p>
            </div>

            <form id="searchForm" class="search-form">
                <div class="terminal-tape" aria-hidden="true"></div>
                <div class="control-top">
                    <div class="search-input-container">
                        <span class="search-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg>
                        </span>
                        <!-- placeholder 必须能整句显示: 原句「…如：我是爱与善意的传播者、水晶」实测需 365px,
                             而输入框内容宽在 1280 下只有 293px(46% 列)、375 下 237px —— 任何视口都放不下,
                             会被拦腰切断。换成下面这句(198px), 375/640/1024/1280 四个视口全部放得下(CDP 实测)。 -->
                        <input type="text" id="query" placeholder="检索爱染诚的台词，如：水晶" required>
                    </div>
                    <button type="button" id="toggleAdvancedOptions" class="toggle-button" aria-expanded="false">
                        高级选项
                        <span class="arrow" aria-hidden="true">▼</span>
                    </button>
                    <div id="advancedOptions" class="advanced-options">
                        <div class="input-row">
                            <label for="minRatio">文本匹配度</label>
                            <input type="number" id="minRatio" placeholder="0-100" min="0" max="100" value="50">
                        </div>
                        <div class="input-row">
                            <label for="minSimilarity">人脸相似度</label>
                            <input type="number" id="minSimilarity" placeholder="0-1" min="0" max="1" step="0.01" value="0">
                        </div>
                    </div>
                    <button type="submit" class="search-button">检 索</button>
                </div>
                <div class="control-bottom">
                    <div class="aizen-row">
                        <!-- 这两个开关原先各带一个水晶装饰(<span class="crys-lit/crys-dim">)。
                             实测: 亮的那个对应【未勾选】的"仅列爱染诚档案", 暗的对应【已勾选】的
                             "爱染诚优先" —— 明暗与真实状态相反, 且都不随勾选变化。做成水晶形状时
                             还能当纹样看, 一旦简化成圆点就会被读成"状态指示灯", 于是成了假指示。
                             直接删掉: 开关滑块自己已经在准确表达开/关(金=开)。 -->
                        <label class="switch-line"><input type="checkbox" id="aizenOnly"> 仅列爱染诚档案</label>
                        <label class="switch-line"><input type="checkbox" id="aizenFirst" checked> 爱染诚优先</label>
                    </div>
                </div>
            </form>

            <div class="progress-section">
                <div class="loading-container">
                    <div id="loadingBar"></div>
                </div>
                <div id="randomStringDisplay" class="random-string" role="status" aria-live="polite"></div>
                <div id="errorDisplay" class="error-display" role="alert" aria-live="assertive"></div>
            </div>
        </section>

        <div id="keywordsContainer" class="keywords-container"></div>
        <section id="results"></section>
    </main>

    <footer class="site-footer">
        <p class="footer-line">本档案转录《罗布奥特曼》全剧字幕，帧图取自原片，仅供对白检索</p>
        <p class="footer-note">怪兽水晶由爱染科技登记在册</p>
    </footer>

    <script src="subtitle_db.js"></script>
    <script src="frames_map.js"></script>
    <script src="db_search.js"></script>
    <script src="script.js?v=11"></script>
</body>
</html>
