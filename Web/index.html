<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱染诚 · 台词档案馆 | 罗布奥特曼</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header" id="refreshDiv" role="button" tabindex="0" title="刷新档案室">
        <div class="header-band">
            <div class="header-brand">
                <svg class="brand-crystal" viewBox="0 0 80 88" aria-hidden="true">
                    <polygon points="40,4 72,22 72,66 40,84 8,66 8,22" fill="none" stroke="#E8C87A" stroke-width="3"/>
                    <polygon points="40,4 72,22 40,40 8,22" fill="#E8C87A" opacity=".35"/>
                    <polygon points="40,40 72,22 72,66 40,84" fill="#B8862F" opacity=".25"/>
                </svg>
                <span class="brand-name">AISOME SCIENCE</span>
                <span class="brand-cn">爱染科技 · 档案科</span>
            </div>
            <div class="header-meta mono">《罗布奥特曼》· 全 25 集 · 对白检索</div>
        </div>
    </header>

    <main class="main-content">
        <section class="hero">
            <div class="hero-titleblock">
                <p class="hero-eyebrow mono">AISOME ARCHIVE · 怪兽水晶档案室</p>
                <h1 class="hero-title">爱染诚 <span class="hero-sub">台词档案馆</span></h1>
                <div class="hero-tie" aria-hidden="true"></div>
                <p class="hero-stats mono">全 25 集 · 归档 4929 条 · 爱染诚登场 420 条</p>
            </div>

            <form id="searchForm" class="search-form">
                <div class="terminal-tape" aria-hidden="true"></div>
                <div class="control-top">
                    <div class="search-input-container">
                        <span class="search-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg>
                        </span>
                        <input type="text" id="query" placeholder="检索爱染诚的台词，如：我是爱与善意的传播者、水晶" required>
                    </div>
                    <button type="button" id="toggleAdvancedOptions" class="toggle-button" aria-expanded="false">
                        高级选项
                        <span class="arrow" aria-hidden="true">▼</span>
                    </button>
                    <div id="advancedOptions" class="advanced-options">
                        <div class="input-row">
                            <label for="minRatio">文本匹配度</label>
                            <input type="number" id="minRatio" placeholder="0-100" min="0" max="100" value="50">
                        </div>
                        <div class="input-row">
                            <label for="minSimilarity">人脸相似度</label>
                            <input type="number" id="minSimilarity" placeholder="0-1" min="0" max="1" step="0.01" value="0">
                        </div>
                    </div>
                    <button type="submit" class="search-button">检 索</button>
                </div>
                <div class="control-bottom">
                    <div class="aisome-row">
                        <label class="switch-line"><span class="crys-lit" aria-hidden="true"></span><input type="checkbox" id="aisomeOnly"> 仅列爱染诚档案</label>
                        <label class="switch-line"><span class="crys-dim" aria-hidden="true"></span><input type="checkbox" id="aisomeFirst" checked> 爱染诚优先</label>
                    </div>
                </div>
            </form>

            <div class="progress-section">
                <div class="loading-container">
                    <div id="loadingBar"></div>
                </div>
                <div id="randomStringDisplay" class="random-string"></div>
                <div id="errorDisplay" class="error-display"></div>
            </div>
        </section>

        <div id="keywordsContainer" class="keywords-container"></div>
        <section id="results"></section>
    </main>

    <footer class="site-footer">
        <p class="footer-line">AISOME ARCHIVE · 本档案录《罗布奥特曼》全剧字幕 · 帧图仅供对白检索</p>
        <p class="footer-note">怪兽水晶 · 由爱染科技登记在册</p>
    </footer>

    <script src="subtitle_db.js"></script>
    <script src="frames_map.js"></script>
    <script src="db_search.js"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
